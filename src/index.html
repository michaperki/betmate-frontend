<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>BetMate - Chess Betting Platform</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BetMate - Real-time chess betting platform with win/draw/loss and move wagers">

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <!-- JetBrains Mono for design fidelity in new UI -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://betmate.app/">
    <meta property="og:title" content="BetMate - Chess Betting Platform">
    <meta property="og:description" content="Place live bets on chess matches with virtual currency">
    <meta property="og:image" content="/icons/icon-512.svg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://betmate.app/">
    <meta property="twitter:title" content="BetMate - Chess Betting Platform">
    <meta property="twitter:description" content="Place live bets on chess matches with virtual currency">
    <meta property="twitter:image" content="/icons/icon-512.svg">

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#111111">

    <!-- Preload main bundle for faster first paint (production builds) -->
    <link rel="preload" href="/bundle.js" as="script" crossorigin>

    <!-- Initial loading styling (static) -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: linear-gradient(145deg, #0a0a0f 0%, #12121a 50%, #0a0a0f 100%);
        color: #F2F2F2;
        font-family: 'Roboto', sans-serif;
        height: 100%;
        width: 100%;
      }
      /* React root should flow normally; centering handled by boot overlay only */
      #main { min-height: 100%; width: 100%; display: block; }
      .boot-card { max-width: 480px; width: calc(100% - 48px); background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 24px; position: relative; overflow: hidden; }
      .boot-brand { display: flex; align-items: center; gap: 12px; }
      .boot-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px; }
      .boot-dot { width: 10px; height: 10px; border-radius: 50%; }
      .boot-title { font-size: 18px; font-weight: 700; color: #22c55e; letter-spacing: 1px; }
      .boot-track { height: 10px; border-radius: 6px; background: rgba(255,255,255,0.06); overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
      .boot-bar { width: 40%; height: 100%; background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); animation: bootmove 1200ms ease-in-out infinite alternate; }
      @keyframes bootmove { from { transform: translateX(-20%); } to { transform: translateX(80%); } }
    </style>
  </head>
  <body>
    <!-- Boot overlay sits above the React root until the app removes it -->
    <div id="boot" style="position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index: 9999;">
      <div class="boot-card">
        <div class="boot-brand" style="display:flex; align-items:center; gap:12px;">
          <img src="/icons/icon-192.svg" alt="BetMate" style="width:36px; height:36px; border-radius:8px; background: rgba(255,255,255,0.06); padding:6px;" />
          <span class="boot-title">BetMate</span>
        </div>
        <div style="margin:12px 0 8px; font-size:14px; font-weight:700; opacity:.9">Loading…</div>
        <div class="boot-track"><div class="boot-bar"></div></div>
      </div>
    </div>
    <!-- React root -->
    <div id="main"></div>

    <noscript>
      <div style="padding: 2rem; text-align: center;">
        <h2>JavaScript Required</h2>
        <p>BetMate requires JavaScript to function. Please enable JavaScript in your browser settings and reload this page.</p>
      </div>
    </noscript>
  </body>
</html>
